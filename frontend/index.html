<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AllSlate</title><link rel="stylesheet" href="runtime.css"></head>
<body><main class="workspace"><aside class="rail"><div class="brand">✦ AllSlate</div><div class="project">D <span>Demo workspace</span></div><nav><button class="active">▣ Workspace</button><button>⌕ Search</button></nav><div class="profile">N</div></aside><section class="documents"><header><div><p>PROJECT LIBRARY</p><h1>Documents</h1></div><label class="icon" title="Upload document">↑<input id="upload" type="file"></label></header><div id="document-list" class="document-list"></div><section id="inspection" class="inspection hidden"></section></section><section class="chat"><header><div><p>DEMO WORKSPACE</p><h1>Ask your library</h1></div><button id="new-chat" class="button">+ New chat</button></header><div id="empty" class="empty"><div class="spark">✦</div><h2>Start with a question</h2><p>AllSlate finds relevant material in your project and keeps every answer tied to its source.</p><button id="start-chat" class="button">+ Start a conversation</button></div><div id="conversation" class="conversation hidden"><div id="messages" class="messages"></div><form id="composer"><textarea id="question" rows="2" placeholder="Ask a question about your documents..."></textarea><button aria-label="Send question">➜</button></form></div></section><aside class="settings"><button id="settings-toggle" class="toggle" title="Toggle settings">☷</button><div id="settings-content"><p>CONVERSATION</p><h2>Answer settings</h2><label class="switch"><span><b>Web search</b><small>Use current web sources when useful</small></span><input id="web-search" type="checkbox"></label><fieldset><legend>Response style</legend><div id="creativity" class="segmented"><button data-level="focused">Focused</button><button class="active" data-level="balanced">Balanced</button><button data-level="creative">Creative</button></div></fieldset><label class="range">Sources per answer <b id="top-k-value">6</b><input id="top-k" type="range" min="1" max="20" value="6"></label><fieldset><legend>Include document types</legend><label><input type="checkbox" value="text" checked> Text</label><label><input type="checkbox" value="table" checked> Table</label><label><input type="checkbox" value="image" checked> Image</label></fieldset></div></aside></main><div id="toast" class="toast hidden"></div><script src="runtime.js"></script></body></html>
